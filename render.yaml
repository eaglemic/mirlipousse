services:
  - type: web
    name: mirlipousse
    runtime: static
    buildCommand: python3 scripts/verifier-paquet.py
    staticPublishPath: ./public
    autoDeployTrigger: off
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

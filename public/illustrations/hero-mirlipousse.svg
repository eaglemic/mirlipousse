<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Un petit monde à découvrir</title><desc id="desc">Composition originale : un arc-en-ciel, des cubes, une fusée et un pochon dans une lumière douce. Illustrations de produits de démonstration.</desc>
<style>
 /* Independent wrappers preserve the illustrated rocket's original rotation. */
 @keyframes ml-rocket-float { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-3px,-13px); } }
 @keyframes ml-star-glow { 0%,100% { opacity:.72; transform:rotate(-4deg); } 50% { opacity:.93; transform:rotate(5deg); } }
 @keyframes ml-leaf-sway { 0%,100% { transform:rotate(-1.4deg); } 50% { transform:rotate(1.4deg); } }
 @media (prefers-reduced-motion:no-preference) {
  .hero-rocket-motion { animation:ml-rocket-float 7.2s ease-in-out infinite; }
  .hero-star { transform-box:fill-box; transform-origin:center; animation:ml-star-glow 8s ease-in-out infinite; }
  .hero-star-second { animation-delay:-3s; }
  .hero-foliage { transform-box:fill-box; transform-origin:62% 100%; animation:ml-leaf-sway 9s ease-in-out infinite; }
 }
 @media (prefers-reduced-motion:reduce) {
  .hero-rocket-motion,.hero-star,.hero-foliage { animation:none!important; transform:none!important; }
 }
</style>
<defs>
 <linearGradient id="room" x1="80" y1="50" x2="1000" y2="850" gradientUnits="userSpaceOnUse"><stop stop-color="#F8EEE2"/><stop offset="1" stop-color="#E7CCB6"/></linearGradient>
 <linearGradient id="wood" x1="600" y1="300" x2="900" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#EBCD9C"/><stop offset="1" stop-color="#B98B57"/></linearGradient>
 <linearGradient id="rocket" x1="820" y1="250" x2="1000" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF8E7"/><stop offset="1" stop-color="#D9C4A5"/></linearGradient>
 <linearGradient id="green" x1="450" y1="170" x2="780" y2="760" gradientUnits="userSpaceOnUse"><stop stop-color="#AEB99B"/><stop offset="1" stop-color="#7F9275"/></linearGradient>
 <linearGradient id="coral" x1="500" y1="200" x2="850" y2="710" gradientUnits="userSpaceOnUse"><stop stop-color="#E8AA8A"/><stop offset="1" stop-color="#C47E60"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="object"><feDropShadow dx="4" dy="18" stdDeviation="16" flood-color="#78583E" flood-opacity=".14"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".024"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
</defs>
